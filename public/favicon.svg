<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#4E1021" />
      <stop offset="60%" stop-color="#2D0712" />
      <stop offset="100%" stop-color="#160509" />
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="40%" stop-color="#E5C158" />
      <stop offset="75%" stop-color="#C89B2B" />
      <stop offset="100%" stop-color="#8C6218" />
    </linearGradient>
  </defs>

  <!-- Royal burgundy circular badge -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="url(#gold)" stroke-width="2.5" />
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="url(#gold)" stroke-width="0.9" stroke-opacity="0.7" />

  <!-- Miniature royal crown -->
  <path d="M23 22 L21 14 L27 18 L32 12 L37 18 L43 14 L41 22 Z" fill="url(#gold)" />
  <rect x="23" y="23" width="18" height="1.8" rx="0.9" fill="url(#gold)" />

  <!-- High-contrast B&A monogram -->
  <text
    x="32"
    y="42.5"
    text-anchor="middle"
    fill="url(#gold)"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="16.5"
    font-weight="700"
    letter-spacing="0.4"
  >
    B&amp;A
  </text>

  <!-- Bottom accent flourish -->
  <path d="M22 48 Q32 52 42 48" stroke="url(#gold)" stroke-width="1.3" stroke-linecap="round" fill="none" />
</svg>
